# ai-composer 0.2.0 — AI 应用开发范式（应用 = 组件组合; 框架 = aic 包, 业务平铺）
# 安装后获得 aic 命令: init/graph/caps/promote/uninstall/template
# 0.2.0: 命名空间重构 —— 框架全部收进 aic/（kernel/extensions/platform/apps/hello_aic/tools）,
# 用户业务平铺项目根 apps/ + extensions/business/, 顶层命名冲突根治

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-composer"
version = "0.2.1.post1"
description = "AI 应用开发范式: 应用 = 组件组合（框架 aic 包 + 业务平铺）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "celery>=5.3",
    "redis>=4.5",
    "python-docx>=1.1",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.0",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
]

[project.scripts]
aic = "aic.tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
# 0.2.0: 发布包只装 aic（框架 = 平台）; 用户业务（根 apps/ + extensions/business/）不进包
include = ["aic*"]
# 真实引擎适配器不进发布包（平台不绑定任何引擎）
exclude = [
    "aic.extensions.platform.loops.hermes*",
]

[tool.setuptools.package-data]
"aic.tools" = ["assets/*.js", "assets/skills/**/*.md"]
"aic.apps.hello_aic" = ["config/*.ini"]

# 非包数据: docs/learn（template 提取用）+ requirements.txt（template 生成依赖用）
[tool.setuptools.data-files]
"docs/learn" = [
    "docs/learn/foundation.md",
    "docs/learn/session-artifact-concept.md",
    "docs/learn/tool-closed-loop.md",
    "docs/learn/tutorial-build-app.md",
]
"." = ["requirements.txt"]
